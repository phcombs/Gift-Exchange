[project]
name = "giftx"
version = "0.1.0"
description = "Gift Exchange"
requires-python = "==3.12.*"
dependencies = [
    "streamlit==1.67.*",
    "google-auth",
    "google-auth-oauthlib",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "giftx"

[tool.uv]
# Newer cryptography releases ship no macOS x86_64 wheel, and building from source needs Rust.
constraint-dependencies = ["cryptography<=48.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
