[project]
name = "giftx"
version = "0.1.0"
description = "Gift Exchange"
requires-python = "==3.12.*"
dependencies = [
    "streamlit==1.67.*",
]

[dependency-groups]
dev = [
    "pytest",
]
# only for regenerating the README screenshots: uv run --group docs python scripts/screenshots.py
docs = [
    "playwright",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "giftx"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
